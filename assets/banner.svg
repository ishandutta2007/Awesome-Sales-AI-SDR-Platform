<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#ec4899;#06b6d4;#6366f1" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#3b82f6;#ec4899;#8b5cf6" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#6366f1;#3b82f6;#06b6d4" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pattern Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="40" cy="0" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 52px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      letter-spacing: 0.5px;
      fill: #94a3b8;
    }
    .tag-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.8px;
    }
    
    @keyframes pulseCircle {
      0% { r: 6px; opacity: 0.8; }
      50% { r: 14px; opacity: 0.2; }
      100% { r: 6px; opacity: 0.8; }
    }
    @keyframes scanMove {
      0% { transform: translateY(-50px); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(420px); opacity: 0; }
    }
    @keyframes orbFloat1 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(30px, -20px) scale(1.1); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    @keyframes orbFloat2 {
      0% { transform: translate(0px, 0px) scale(1.1); }
      50% { transform: translate(-35px, 25px) scale(0.95); }
      100% { transform: translate(0px, 0px) scale(1.1); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -100; }
    }

    .scanning-beam {
      animation: scanMove 4s ease-in-out infinite;
    }
    .orb-1 {
      animation: orbFloat1 8s ease-in-out infinite;
    }
    .orb-2 {
      animation: orbFloat2 9s ease-in-out infinite;
    }
    .data-line {
      stroke-dasharray: 6, 6;
      animation: dashMove 3s linear infinite;
    }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />
  
  <!-- Subtle Grid Background -->
  <rect width="1200" height="400" fill="url(#grid)" rx="16" />

  <!-- Animated Glowing Orbs -->
  <g filter="url(#glow)">
    <circle class="orb-1" cx="220" cy="120" r="140" fill="#6366f1" fill-opacity="0.22" />
    <circle class="orb-2" cx="980" cy="280" r="160" fill="#06b6d4" fill-opacity="0.18" />
    <circle class="orb-1" cx="600" cy="360" r="120" fill="#ec4899" fill-opacity="0.15" />
  </g>

  <!-- Network Circuit Constellation Nodes -->
  <g stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5">
    <line x1="120" y1="180" x2="260" y2="100" class="data-line" />
    <line x1="260" y1="100" x2="380" y2="220" class="data-line" />
    <line x1="380" y1="220" x2="520" y2="150" class="data-line" />
    <line x1="700" y1="260" x2="840" y2="160" class="data-line" />
    <line x1="840" y1="160" x2="980" y2="240" class="data-line" />
    <line x1="980" y1="240" x2="1080" y2="140" class="data-line" />
  </g>

  <g fill="#38bdf8" filter="url(#subtleGlow)">
    <circle cx="120" cy="180" r="4" />
    <circle cx="260" cy="100" r="5" fill="#818cf8" />
    <circle cx="380" cy="220" r="4" fill="#ec4899" />
    <circle cx="520" cy="150" r="5" />
    <circle cx="700" cy="260" r="4" fill="#a855f7" />
    <circle cx="840" cy="160" r="6" fill="#38bdf8" />
    <circle cx="980" cy="240" r="5" fill="#f43f5e" />
    <circle cx="1080" cy="140" r="4" />
  </g>

  <!-- Scanning Beam Effect -->
  <g class="scanning-beam">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#glowLine)" stroke-width="2" />
    <polygon points="0,0 1200,0 1200,-30 0,-10" fill="url(#glowLine)" opacity="0.15" />
  </g>

  <!-- Top Pill / Badge -->
  <g transform="translate(435, 48)">
    <rect width="330" height="34" rx="17" fill="#1e1b4b" stroke="url(#accentGrad)" stroke-width="1.5" />
    <circle cx="22" cy="17" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="38" y="22" class="tag-text" fill="#c7d2fe">AUTONOMOUS GTM &amp; SALES AGENTS</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(600, 165)" text-anchor="middle">
    <text class="title-text" fill="url(#accentGrad)" filter="url(#subtleGlow)">
      Awesome Sales AI SDR Platform
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 225)" text-anchor="middle">
    <text class="subtitle-text">
      Autonomous Outbound Agents • Lead Research • Multi-Channel Sequencing • Meeting Booking
    </text>
  </g>

  <!-- Feature Badges -->
  <g transform="translate(180, 285)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect width="190" height="42" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" />
      <text x="95" y="26" text-anchor="middle" class="tag-text" fill="#f8fafc">🤖 AI SDR Copilots</text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(210, 0)">
      <rect width="200" height="42" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" />
      <text x="100" y="26" text-anchor="middle" class="tag-text" fill="#f8fafc">⚡ Top SaaS &amp; Open-Source</text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(430, 0)">
      <rect width="200" height="42" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" />
      <text x="100" y="26" text-anchor="middle" class="tag-text" fill="#f8fafc">🎯 Lead Intelligence</text>
    </g>
    <!-- Badge 4 -->
    <g transform="translate(650, 0)">
      <rect width="190" height="42" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" />
      <text x="95" y="26" text-anchor="middle" class="tag-text" fill="#f8fafc">📅 Auto Meeting Booking</text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="394" width="1200" height="6" fill="url(#accentGrad)" rx="3" />
</svg>